<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repository Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        input {
            display: block;
            width: 300px;
            padding: 10px;
            margin: 20px auto 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            display: block;
            margin: 0 auto 20px;
            padding: 10px 25px;
            background-color: #24292f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #444;
        }

        #message {
            text-align: center;
            margin: 20px 0;
            color: #d9534f;
            font-weight: bold;
        }

        #owner,
        #repositories {
            max-width: 800px;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #owner,
        #repositories {
            display: none;
        }

        #owner h2,
        #repositories h2 {
            color: #24292f;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        #repositories > div {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px 0;
            border-radius: 6px;
        }

        #repositories h3 {
            margin-top: 0;
            color: #0969da;
        }

        #repositories p {
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>GitHub Repository Tracker</h1>
    <input type="text" id="username" placeholder="Enter GitHub username">
    <button id="searchButton">Search</button>
    <div id="message"></div>
    <div id="owner"></div>
    <div id="repositories"></div>
    <script src="script.js"></script>
</body>
</html>
